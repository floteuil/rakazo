services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rakazo
      POSTGRES_PASSWORD: rakazo
      POSTGRES_DB: rakazo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakazo"]
      interval: 3s
      timeout: 5s
      retries: 20

  omniroute:
    build:
      context: ../..
      dockerfile: deploy/omniroute/Dockerfile
    image: rakazo/omniroute:local
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-sk-omniroute-local-key}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
    expose:
      - "8080"
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  supervisor:
    build:
      context: ../..
      dockerfile: infra/sandboxes/supervisor/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: rakazo/computer:local
      SANDBOX_SCREEN_NETWORK: internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data:/data
    networks:
      - app
      - data
    depends_on:
      computer:
        condition: service_completed_successfully

  computer:
    image: rakazo/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"
    networks:
      - app

  data-init:
    image: busybox:1
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    volumes:
      - ../../data:/data
    networks:
      - app

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["bash", "-lc", "pnpm --filter @rakazo/db exec prisma migrate deploy && pnpm --filter @rakazo/api start"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://rakazo:rakazo@postgres:5432/rakazo
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
      OMNIROUTE_BASE_URL: http://omniroute:8080/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-sk-omniroute-local-key}
    ports:
      - "3100:3100"
    volumes:
      - ../../data:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      omniroute:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@rakazo/worker", "start"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://rakazo:rakazo@postgres:5432/rakazo
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
      OMNIROUTE_BASE_URL: http://omniroute:8080/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-sk-omniroute-local-key}
    volumes:
      - ../../data:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      omniroute:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@rakazo/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      API_PROXY_TARGET: http://api:3100
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      RAKAZO_HOST: ${RAKAZO_HOST:-localhost}
    ports:
      - "5173:5173"
    networks:
      - app
    depends_on:
      - api

volumes:
  pgdata:

networks:
  app:
  data:
    internal: true
